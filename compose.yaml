# Standalone API example. Full production stack: deploy/docker/compose.yaml
# Follow docs/production-docker.md for multi-skill migration.
services:
  finance-skill-eval:
    build: .
    ports:
      - "56361:56361"
    environment:
      FINANCE_EVAL_MAX_CONCURRENT_RUNS: "1"
      FINANCE_EVAL_AGENT_RUNTIME_URL: http://agent-runtime:56363
      FINANCE_EVAL_ACCESS_TOKEN: ${FINANCE_EVAL_ACCESS_TOKEN:?Set a shared access token}
      FINANCE_RUNTIME_CONFIG: /run/config/runtime.json
    depends_on:
      agent-runtime:
        condition: service_healthy
    volumes:
      - finance-skill-eval-data:/app/data
      - ${FINANCE_RUNTIME_CONFIG:?Set an absolute runtime configuration path}:/run/config/runtime.json:ro
    restart: unless-stopped

  agent-runtime:
    build: .
    command: ["/app/.venv-openjiuwen/bin/python", "-m", "uvicorn", "integrations.openjiuwen.migration_runtime:app", "--host", "0.0.0.0", "--port", "56363"]
    environment:
      FINANCE_EVAL_DATA_DIR: /app/data
      FINANCE_RUNTIME_CONFIG: /run/config/runtime.json
      FINANCE_EVAL_ACCESS_TOKEN: ${FINANCE_EVAL_ACCESS_TOKEN:?Set a shared access token}
    volumes:
      - finance-skill-eval-data:/app/data
      - ${FINANCE_RUNTIME_CONFIG:?Set an absolute runtime configuration path}:/run/config/runtime.json:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:56363/internal/health',{headers:{authorization:'Bearer '+process.env.FINANCE_EVAL_ACCESS_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 20s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  finance-skill-eval-data:
