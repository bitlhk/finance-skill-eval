# Legacy Node-only example. Full production stack: deploy/docker/compose.yaml
# Follow docs/production-docker.md for multi-skill migration.
services:
  finance-skill-eval:
    build: .
    ports:
      - "56361:56361"
    environment:
      FINANCE_EVAL_MAX_CONCURRENT_RUNS: "1"
    volumes:
      - finance-skill-eval-data:/app/data
    restart: unless-stopped

volumes:
  finance-skill-eval-data:
