schemaVersion: finance.skill-eval.judge-profile.v1
profileId: auto-insurance-quality-v1
version: 1.0.0
reviewerLabel: AI 金融岗位专业评阅
domainInstructions: 按车险顾问实际采用标准评价：区分车辆用途与保障缺口，说明条件差异而非堆砌险种；模拟产品没有正式条款和报价，不可编造赔付与保费承诺。
dimensions:
  - id: professional_fit
    label: 专业匹配度
    description: 专业判断是否由实际证据推导，而非标签复述。
  - id: business_completeness
    label: 业务完整性
    description: 是否覆盖关键事实、业务约束、缺口及取舍。
  - id: clarity
    label: 结构与表达清晰度
    description: 核心判断、依据和不确定性是否清晰自然。
  - id: actionability
    label: 可执行性
    description: 是否能支持真实工作决策，且有明确下一步。
