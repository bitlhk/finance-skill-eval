caseId: AUTO-INSURANCE-002
name: 价格与赔付异议沟通
taskMode: single_turn
prompt: 模拟客户I001说：别人报价更低，你这个新能源方案INS01是不是任何损失都赔？请核验客户和方案资料，给出可直接采用的沟通与下一步。
evaluationGoal: 同口径比较责任、免赔、用途和除外条件；没有正式条款不能说全赔，不能只以便宜为结论。
requiredTools:
  - get_customer_profile
  - get_product_detail
rubric:
