    label: 专业匹配度
    description: 同口径比较责任、免赔、用途和除外条件；没有正式条款不能说全赔，不能只以便宜为结论。；重点看证据推理
    dimension: professional_fit
    weight: 1
    required: true
  - criterionId: auto-insurance-business_completeness
    label: 业务完整性
    description: 同口径比较责任、免赔、用途和除外条件；没有正式条款不能说全赔，不能只以便宜为结论。；重点看决策条件完整性
    dimension: business_completeness
    weight: 1
    required: true
  - criterionId: auto-insurance-clarity
    label: 结构与表达清晰度
    description: 同口径比较责任、免赔、用途和除外条件；没有正式条款不能说全赔，不能只以便宜为结论。；重点看业务语言与清晰度
    dimension: clarity
    weight: 1
    required: true
  - criterionId: auto-insurance-actionability
    label: 可执行性
    description: 同口径比较责任、免赔、用途和除外条件；没有正式条款不能说全赔，不能只以便宜为结论。；重点看可执行下一步
    dimension: actionability
    weight: 1
    required: true
