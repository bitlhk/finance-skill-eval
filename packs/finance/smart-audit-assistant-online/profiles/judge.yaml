schemaVersion: finance.skill-eval.judge-profile.v1
profileId: credit-review-quality-v1
version: 1.0.0
reviewerLabel: AI 金融岗位专业评阅
domainInstructions: 按信贷材料审核底稿评价：金额比较之前对齐主体、期间、单位、现金与收入确认口径。制度没有阈值不得自创；材料冲突不自动等于欺诈，审核意见不是授信审批。
dimensions:
  - id: professional_fit
    label: 专业匹配度
    description: 专业判断是否由实际证据推导，而非标签复述。
  - id: business_completeness
    label: 业务完整性
    description: 是否覆盖关键事实、业务约束、缺口及取舍。
  - id: clarity
    label: 结构与表达清晰度
    description: 核心判断、依据和不确定性是否清晰自然。
  - id: actionability
    label: 可执行性
    description: 是否能支持真实工作决策，且有明确下一步。
