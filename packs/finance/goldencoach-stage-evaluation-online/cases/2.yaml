caseId: SALES-COACHING-002
name: 完整训练复盘
taskMode: single_turn
prompt: 虚构对话：顾问：今天方便花几分钟聊续保吗？客户：可以。顾问：最近用车有什么变化？客户：开始每天接送孩子了。顾问：那我推荐加保障。客户：比去年贵，我不想加钱。顾问：您更在意预算，还是不清楚多保什么？客户：不知道多花的钱值不值。顾问：我明天把同保障和调整保障两种报价列清楚，您再比较，可以吗？客户：明天发给我吧。请做完整训练复盘，给出各阶段有证据的评分与改进建议。
evaluationGoal: 观察实际出现的许可、发现、异议澄清和下一步；区分服务推进与成交；没有证据的维度不虚构评分；给出可直接采用的改进动作。
