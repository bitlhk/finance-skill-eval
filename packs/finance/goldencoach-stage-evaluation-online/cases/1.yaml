caseId: SALES-COACHING-001
name: 续保异议的阶段点评
taskMode: single_turn
prompt: 以下为虚构陪练对话：顾问：您的车险快到期了，今年建议增加保障。客户：去年也没出险，怎么还要多花钱？顾问：保障更全总是好事，今天可以定下来吗？客户：我再看看。请简短点评这轮沟通，并给我下一轮最值得问的两个问题和一句衔接话术。
evaluationGoal: 基于客户原句解释过早推方案与推进成交的问题；两个问题应核实保费顾虑与保障或用车变化；不能推断客户收入、性格或臆测涨价原因。
