caseId: SALES-COACHING-003
name: 信息不足时仍给有效建议
taskMode: single_turn
prompt: 虚构练习记录只有一句：客户说‘你们的保费太贵了’，没有其他对话。请告诉我该怎么接话，以及现在能否判断我的销售水平或客户购买意愿。
