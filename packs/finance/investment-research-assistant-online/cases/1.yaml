caseId: INVESTMENT-RESEARCH-001
name: 利润增长的含金量
taskMode: single_turn
prompt: 请研究虚构公司海岳设备（DEMO001）的2026年半年报，判断利润增长的现金含量，给出证据、两种待验证解释和最关键的跟踪指标。
