# Dedicated origin listener; run with -p pointing to the private origin directory.
# This is not the system-wide nginx configuration.
worker_processes 1;
pid nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path client_temp;
    proxy_temp_path proxy_temp;
    fastcgi_temp_path fastcgi_temp;
    uwsgi_temp_path uwsgi_temp;
    scgi_temp_path scgi_temp;

    server {
        listen 0.0.0.0:15671 ssl;
        server_name 111.119.236.165;
        ssl_certificate ../.public-demo/origin/origin.crt;
        ssl_certificate_key ../.public-demo/origin/origin.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:OriginSSL:1m;

        # Check the TCP peer, not a user-supplied forwarding header.
        allow 116.204.37.89;
        deny all;

        client_max_body_size 2m;
        location / {
            proxy_pass http://127.0.0.1:56371;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }
    }
}
