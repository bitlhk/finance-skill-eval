name: Offline integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The platform starts delivered Python services with `uv run`, and the skeleton check needs
      # it for the Python skeleton. Both are steps below.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv==0.12.13
      - run: pnpm setup:openjiuwen
      - run: pnpm check:openjiuwen
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/native-fixture-profile.test.mjs
      - run: pnpm python:openjiuwen -m unittest integrations.openjiuwen.test_bundle_runtime integrations.openjiuwen.test_migration_runtime integrations.openjiuwen.test_migration_pool
      - run: pnpm python:openjiuwen -m unittest integrations.openjiuwen.test_script_process integrations.openjiuwen.test_instance_manager
      - run: pnpm python:openjiuwen -m unittest tests.test_candidate_proxy_budget tests.test_account_candidate_deploy tests.test_formal_entry_deploy
      - run: pnpm python:openjiuwen -m unittest discover -s scripts -p test_retained_launcher_evidence.py
      - run: pnpm python:openjiuwen -m unittest discover -s scripts -p test_managed_release_capacity.py
      - run: pnpm build
      - name: Run the MCP skeletons the skill package hands the agent
        run: pnpm test:skeleton:mcp
      - name: Bounded synthetic MCP source (isolated TCP and pinned identity)
        run: pnpm python:openjiuwen -m unittest integrations.openjiuwen.test_bounded_reference_mcp integrations.openjiuwen.test_reference_mcp
      - name: Verify all four enterprise migration fixtures offline
        run: pnpm test:migration:enterprise:offline
      - name: Compile native target (no live credentials or model calls)
        run: mvn -B -f examples/migration-native-host/pom.xml package
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify-environment-matching-ui.mjs /tmp/eval-matching-ui
      - name: Private subpath build
        run: VITE_PRIVATE_WORKSPACE=true pnpm exec vite build --base=/migration/ --outDir=../web-dist-private
      - name: Authenticated single and multi Skill browser regression, on the private subpath
        run: MIGRATION_TEST_WEB_DIR=web-dist-private MIGRATION_TEST_PREFIX=/migration MIGRATION_TEST_PRIVATE_GATEWAY=true node scripts/verify-native-http.mjs --ui
      - name: Keep the failure picture when the browser check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-ui-failure
          path: artifacts/native-http-*/
          if-no-files-found: ignore
