name: Offline integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The platform starts delivered Python services with `uv run`, and the skeleton check needs
      # it for the Python skeleton. Both are steps below.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install uv==0.12.13
      - run: pnpm check
      - run: pnpm test
      - run: node scripts/native-fixture-profile.test.mjs
      - run: python -m unittest integrations.openjiuwen.test_script_process integrations.openjiuwen.test_instance_manager
      - run: pnpm build
      - name: Run the MCP skeletons the skill package hands the agent
        env:
          FINANCE_EVAL_MIGRATION_PYTHON: integrations/openjiuwen/.venv/bin/python
        run: |
          uv sync --project integrations/openjiuwen --frozen
          pnpm test:skeleton:mcp
      - name: Bounded synthetic MCP source (isolated TCP and pinned identity)
        run: integrations/openjiuwen/.venv/bin/python -m unittest integrations.openjiuwen.test_bounded_reference_mcp integrations.openjiuwen.test_reference_mcp
      - name: Analysis file tools cannot read another workspace
        run: integrations/openjiuwen/.venv/bin/python -m unittest tests.test_analysis_file_boundary tests.test_analysis_workspace_text
      - name: Verify all four enterprise migration fixtures offline
        run: pnpm test:migration:enterprise:offline
      - name: Compile native target (no live credentials or model calls)
        run: mvn -B -f examples/migration-native-host/pom.xml package
      - run: pnpm exec playwright install --with-deps chromium
      - name: Private subpath build
        run: VITE_PRIVATE_WORKSPACE=true pnpm exec vite build --base=/migration/ --outDir=../web-dist-private
      - name: Authenticated browser regression, on the private subpath
        run: FINANCE_EVAL_TRUSTED_LOCAL_SCRIPTS=1 MIGRATION_TEST_WEB_DIR=web-dist-private MIGRATION_TEST_PREFIX=/migration/ MIGRATION_TEST_PRIVATE_GATEWAY=true node scripts/verify-migration-v2-ui.mjs
      - name: Keep the failure picture when the browser check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-ui-failure
          path: reports/migration-v2-ui/failure.png
          if-no-files-found: ignore
