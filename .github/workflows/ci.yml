name: Offline integration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Compile native target (no live credentials or model calls)
        run: mvn -B -f examples/migration-native-host/pom.xml package
      - run: pnpm exec playwright install --with-deps chromium
      - name: Private subpath build
        run: VITE_PRIVATE_WORKSPACE=true pnpm exec vite build --base=/migration/ --outDir=../web-dist-private
      - name: Authenticated browser regression, on the private subpath
        run: MIGRATION_TEST_WEB_DIR=web-dist-private MIGRATION_TEST_PREFIX=/migration/ MIGRATION_TEST_PRIVATE_GATEWAY=true node scripts/verify-migration-v2-ui.mjs
      - name: Keep the failure picture when the browser check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-ui-failure
          path: reports/migration-v2-ui/failure.png
          if-no-files-found: ignore
